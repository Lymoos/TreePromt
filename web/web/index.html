<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PromptTree — идеи на ходу, задачи для Claude.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PromptTree">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PromptTree</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --bg: #ffffff; --tile: #111111; --inner: #ffffff; --muted: #a8a8a8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e0e; --tile: #ececec; --inner: #0e0e0e; --muted: #5c5c5c; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }

    /* Заставка, пока загружается приложение: логотип «вырастает» и мягко дышит. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: var(--bg); transition: opacity .45s ease, transform .45s ease;
      font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--muted);
      letter-spacing: .04em;
    }
    #splash.hide { opacity: 0; transform: scale(1.03); pointer-events: none; }
    #splash svg { width: 64px; height: 64px; animation: pt-in .7s cubic-bezier(.2,.9,.3,1.2) both, pt-breathe 2.4s ease-in-out .9s infinite; }
    #splash .tile { fill: var(--tile); }
    #splash .inner { fill: var(--inner); }
    #splash .branch { fill: none; stroke: var(--inner); stroke-width: 1.8; stroke-dasharray: 12; stroke-dashoffset: 12; animation: pt-draw .6s ease-out .35s forwards; }
    #splash .file { opacity: 0; animation: pt-fade .4s ease-out .8s forwards; }
    #splash .dots span { display: inline-block; width: 5px; height: 5px; margin: 0 3px; border-radius: 50%; background: var(--muted); animation: pt-dot 1.2s ease-in-out infinite; }
    #splash .dots span:nth-child(2) { animation-delay: .15s; }
    #splash .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes pt-in { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes pt-breathe { 50% { transform: scale(1.04); } }
    @keyframes pt-draw { to { stroke-dashoffset: 0; } }
    @keyframes pt-fade { to { opacity: 1; } }
    @keyframes pt-dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      #splash svg, #splash .branch, #splash .file, #splash .dots span { animation: none; opacity: 1; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Загрузка PromptTree">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect class="tile" x="1.5" y="1.5" width="21" height="21" rx="5"/>
      <rect class="inner" x="6" y="5.5" width="5" height="5" rx="1"/>
      <path class="branch" d="M8.5 10.5V17.5H12.5" stroke-linecap="square"/>
      <path class="branch" d="M8.5 13.5H12.5" stroke-linecap="square"/>
      <rect class="inner file" x="14" y="12.25" width="4.5" height="2.5" rx=".6"/>
      <rect class="inner file" x="14" y="16.25" width="3" height="2.5" rx=".6"/>
    </svg>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <script>
    // Убираем заставку, как только Flutter нарисовал первый кадр.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

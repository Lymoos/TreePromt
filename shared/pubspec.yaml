name: prompttree_shared
description: Shared PromptTree code for mobile, desktop and web — core, models, domain, data, sync, api.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13
  sqlite3: ^2.4.0

flutter:
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

# Проверки на каждый push и PR; на main — ещё и образы для VPS (ghcr.io).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci_only@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 ./...

  aicrew:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # домашний хост — Windows (DPAPI)
    defaults:
      run:
        working-directory: aicrew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aicrew/go.mod
          cache-dependency-path: aicrew/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -count=1 ./...

  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, app-mobile, app-desktop, web]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - name: SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: tests (без скриншотов — они сняты на Windows)
        run: flutter test --exclude-tags golden

  images:
    needs: [backend, aicrew, flutter]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/lymoos/treepromt-backend:latest
            ghcr.io/lymoos/treepromt-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Lymoos/TreePromt
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: web image (Caddy + Flutter Web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/lymoos/treepromt-web:latest
            ghcr.io/lymoos/treepromt-web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Lymoos/TreePromt
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

# Локальная проверка полной связки (Caddy + backend + PostgreSQL + веб) без домена и HTTPS,
# всё собирается из исходников:
#   docker compose -p prompttree-local --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Веб предварительно собрать в deploy/web (см. web/README.md). Открыть http://localhost:8088
services:
  backend:
    image: prompttree-backend:local
    build: ..
    environment:
      ALLOWED_ORIGINS: http://localhost:8088
      ALLOW_REGISTRATION: "true"
  caddy:
    image: caddy:2.8-alpine
    ports: !override
      - "127.0.0.1:8088:8088"
    environment:
      DOMAIN: http://localhost:8088
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
  backup:
    profiles: [backup] # локально бэкапы не нужны

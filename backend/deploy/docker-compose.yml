# Развёртывание на VPS: backend + PostgreSQL + Caddy с веб-версией + ежедневный бэкап.
# Образы собирает GitHub Actions (ghcr.io). Установка: deploy/install.sh, обновление: deploy/update.sh.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prompttree
      POSTGRES_USER: prompttree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prompttree"]
      interval: 5s
      retries: 10

  backend:
    image: ghcr.io/lymoos/treepromt-backend:${PT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://prompttree:${POSTGRES_PASSWORD}@db:5432/prompttree?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
      ALLOW_REGISTRATION: "false" # регистрация открыта, только пока нет ни одного пользователя
      TRUST_PROXY: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-200}

  # Caddy: HTTPS (Let's Encrypt), веб-версия и прокси /api → backend.
  caddy:
    image: ghcr.io/lymoos/treepromt-web:${PT_VERSION:-latest}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      # 80 нужен Let's Encrypt для выпуска сертификата. Если 443 занят (например, VPN),
      # задайте HTTPS_PORT в .env — тогда адрес будет https://домен:порт.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # Ежедневный pg_dump, хранится 14 дней. Пока копии лежат на самом VPS
  # (решение от 08.10.2026): при потере VPS теряются и они.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          ts=$$(date +%Y-%m-%d_%H%M)
          if pg_dump -h db -U prompttree -Fc prompttree > /backups/prompttree_$$ts.dump.tmp; then
            mv /backups/prompttree_$$ts.dump.tmp /backups/prompttree_$$ts.dump
            echo "backup ok: $$ts"
          else
            rm -f /backups/prompttree_$$ts.dump.tmp
            echo "backup FAILED: $$ts"
          fi
          find /backups -name 'prompttree_*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
